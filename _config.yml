title: Bean's Blog
email: your-email@domain.com
description: >-
  Notes on underwater acoustics, signal processing, FPGAs and
  open-source hardware — an engineering notebook.
baseurl: ""
url: "https://nishuidegou.github.io"
twitter_username: nishuidegou
github_username: nishuidegou

# 顶部导航只放这几页；其它页面（如 /sketch-to-comic/usage/ 使用说明）仍可按链接访问
header_pages:
  - about.md

# 留言功能：纯静态站点无后端，表单把「名称 + 内容」预填成该仓库的一条 Issue
comment_repo: nishuidegou/nishuidegou.github.io

permalink: /:categories/:year/:month/:day/:title/

markdown: kramdown
theme: minima

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
